[package]
name = "elelemer"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/rodneylab/elelemer"
# eventsource-client v0.17.5 requires Rust 1.94.0
rust-version = "1.94.0"
description = "CLI utility for running local Large Language Model completions using Llama.cpp and Ollama"

[lib]
path = "src/lib.rs"
name = "elelemer"

[[bin]]
path = "src/main.rs"
name = "elelemer"

[features]
internal-tools = []

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
clap-markdown = "0.1.5"
clap-verbosity-flag = "3.0.4"
config = "0.15.24"
dirs = "6.0.0"
env_logger = "0.11.10"
eventsource-client = "0.17.5"
futures-util = "0.3.32"
http = "1.4.2"
hyper-util = "0.1.20"
indicatif = { version = "0.18.4", features = ["futures"] }
jiff = { version = "0.2.28", features = ["serde"] }
launchdarkly-sdk-transport = { version = "0.1.3", features = ["hyper-rustls-webpki-roots"] }
log = "0.4.32"
miette = { version = "7.6.0", features = ["fancy"] }
owo-colors = "4.3.0"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
assert_fs = "1.1.4"
fake = "5.1.0"
insta = { version = "1.48.0", features = ["glob", "json"] }
mocktail = "0.3.2"
proptest = "1.11.0"
rexpect = "0.7.1"
snapbox = { version = "1.2.2", features = ["cmd", "debug"] }
tempfile = "3.27.0"
trycmd = "1.2.0"

[lints.clippy]
allow_attributes = "deny"
dbg_macro = "deny"
print_stdout = "deny"
clone_on_ref_ptr = "deny"
empty_drop = "deny"
exit = "deny"
filetype_is_file = "deny"
get_unwrap = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
rest_pat_in_fully_bound_structs = "deny"
unnecessary_safety_comment = "deny"
debug_assert_with_mut_call = "warn"
iter_on_single_items = "warn"
needless_pass_by_ref_mut = "warn"
redundant_clone = "warn"
redundant_pub_crate = "warn"
significant_drop_in_scrutinee = "warn"
unused_peekable = "warn"

[[test]]
name = "integration"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
